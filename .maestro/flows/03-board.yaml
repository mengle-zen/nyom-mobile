# 보드 — 그룹을 열고 끼니 칩을 옮기고, 날짜를 하루 전으로 넘겼다가 그룹 목록으로 돌아온다.
appId: nyom.mengle.zen
name: 보드
---
- launchApp
- extendedWaitUntil:
    visible: "E2E 전용, .* 보드 열기"
    timeout: 20000
- tapOn: "E2E 전용, .* 보드 열기"
- extendedWaitUntil:
    visible: "아침 .* 올림"
    timeout: 20000
- takeScreenshot: e2e/03-board
# 화면 끝 탭으로 끼니 넘기기(시안 A안)는 타일 격자에서만 동작한다. E2E 전용 그룹은 기록이
# 하나도 없어 격자 대신 「아직 첫 끼니가 없어요」가 뜨므로 여기서는 확인하지 않는다
# (기록이 있는 그룹에서 수동 확인 — 2026-10-20).
- tapOn: "저녁 .* 올림"
- waitForAnimationToEnd
# E2E 전용 그룹은 기록이 없어 끼니 칸 대신 빈 안내가 뜬다 — 칩이 그대로 있는지만 본다.
- assertVisible: "저녁 .* 올림"
- tapOn: "이전 날짜"
- waitForAnimationToEnd
- assertVisible: "날짜 선택 .* 현재 어제.*"
- takeScreenshot: e2e/03-board-prev-day
- tapOn: "그룹 목록으로"
- extendedWaitUntil:
    visible: "내 그룹"
    timeout: 10000
