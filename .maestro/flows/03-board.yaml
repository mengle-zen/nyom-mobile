# 보드 — 그룹을 열고, 날짜를 하루 전으로 넘겼다가 그룹 목록으로 돌아온다.
# 시간 띠(2026-10-27)는 기록이 있어야 그려진다. E2E 전용 그룹은 비어 있어 빈 안내가 뜨므로
# 띠 자체는 기록이 있는 그룹에서 수동 확인한다(올리기 흐름 05가 띠에 내 사진이 뜨는지 본다).
appId: nyom.mengle.zen
name: 보드
---
- launchApp
- extendedWaitUntil:
    visible: "E2E 전용, .* 보드 열기"
    timeout: 20000
- tapOn: "E2E 전용, .* 보드 열기"
- extendedWaitUntil:
    visible: "날짜 선택 .* 현재 오늘.*"
    timeout: 20000
- takeScreenshot: e2e/03-board
- tapOn: "이전 날짜"
- waitForAnimationToEnd
- assertVisible: "날짜 선택 .* 현재 어제.*"
- takeScreenshot: e2e/03-board-prev-day
- tapOn: "그룹 목록으로"
- extendedWaitUntil:
    visible: "내 그룹"
    timeout: 10000
