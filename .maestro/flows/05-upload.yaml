# 올리기 — 탭바 카메라 → (화면 전환이 끝난 뒤) OS 카메라 → 셔터 → 사진 사용 → 미리보기 →
# 받는 곳 고르기 → 보내기 → 보드 → 5초 안에 되돌리기 → 미리보기로 복귀 → 그만두기.
#
# 실제 서버에 올리므로 테스트 계정 혼자인 비공개 그룹 「E2E 전용」에만 보내고 곧바로 되돌린다.
# 테스트 계정은 이 그룹 하나에만 속한다 — 친구들 그룹에 테스트 기록이 보이지 않게.
# iOS 27 시뮬레이터에는 가상 카메라가 있다(18 이하 시뮬레이터는 카메라가 없어 안내로 떨어짐).
appId: nyom.mengle.zen
name: 올리기
---
- launchApp
- extendedWaitUntil:
    visible: "내 그룹"
    timeout: 20000
- tapOn: "기록"
# 무한 로딩 회귀 확인 — 카메라가 실제로 떠야 한다.
# 시뮬레이터·에뮬레이터 카메라로는 쓸 만한 사진이 안 나오므로(촬영은 실기기에서 확인)
# 카메라가 뜨는 것까지만 보고 닫은 뒤, 선택 화면 → 갤러리 경로로 나머지를 검증한다.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Take Picture"
          timeout: 10000
      - takeScreenshot: e2e/05-camera
      - tapOn: "Close"
- runFlow:
    when:
      platform: Android
    commands:
      # 첫 실행이면 카메라 권한 창
      - tapOn:
          text: "While using the app|앱 사용 중에만 허용|Only this time|이번만 허용"
          optional: true
      - extendedWaitUntil:
          notVisible: "내 그룹"
          timeout: 10000
      - takeScreenshot: e2e/05-camera
      - back
- extendedWaitUntil:
    visible: "갤러리에서 고르기"
    timeout: 10000
- tapOn: "갤러리에서 고르기"
- waitForAnimationToEnd
# 시스템 사진 선택기 — 가장 최근 사진(맨 위 왼쪽)
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "17%,22%"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "17%,34%"
- extendedWaitUntil:
    visible: "받는 곳"
    timeout: 15000
- takeScreenshot: e2e/05-preview
# 그룹이 하나뿐이면 받는 곳이 처음부터 그 그룹이어야 한다(기본값 규칙).
- extendedWaitUntil:
    visible: "E2E 전용에 보내기"
    timeout: 5000
# 받는 곳 시트는 열고 닫기만 — 누르면 체크가 풀린다.
- tapOn:
    text: "받는 곳: .*"
- extendedWaitUntil:
    visible: "어디에 올릴까요?"
    timeout: 5000
- assertVisible: "E2E 전용 그룹에 올리기"
- tapOn: "완료"
# 되돌리기 토스트는 5초뿐이다. 탭 뒤 화면이 잠잠해지길 기다리면(기본) Android
# 에뮬레이터에선 그 사이 토스트가 사라져 놓친다.
- tapOn:
    text: "E2E 전용에 보내기"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "되돌리기"
    timeout: 20000
# 보드가 그날 시간 띠를 열어 내 사진이 보여야 한다 — 스크린샷으로 남긴다. 여기서 요소를 찾는
# 단계를 더하면 5초짜리 되돌리기 스낵바가 사라진 뒤에 누르게 된다(2026-10-28 실패).
- takeScreenshot: e2e/05-sent
- tapOn:
    text: "되돌리기"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "받는 곳"
    timeout: 15000
- takeScreenshot: e2e/05-undone
- tapOn: "닫기"
- tapOn: "그만두기"
# 되돌리기는 보드 위에 업로드를 다시 연 것이라, 닫으면 보내기 전의 보드로 돌아간다.
- extendedWaitUntil:
    visible: "날짜 선택 .* 현재 오늘.*"
    timeout: 10000
- tapOn: "그룹 목록으로"
- extendedWaitUntil:
    visible: "내 그룹"
    timeout: 10000
