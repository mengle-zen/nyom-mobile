name: CI

# PR과 main 푸시에서 타입·테스트·린트를 강제한다.
on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 취소한다 — 마지막 커밋 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 타입 검사
            command: pnpm exec tsc --noEmit
          - name: 테스트
            command: pnpm exec vitest run
          - name: 린트
            command: pnpm lint
    steps:
      - uses: actions/checkout@v7

      # package.json의 packageManager를 읽어 로컬과 같은 pnpm 버전을 쓴다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # lockfile과 어긋나면 실패시킨다 — CI가 로컬과 다른 트리를 검사하지 않도록.
      - run: pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

# expo-doctor는 일부러 넣지 않았다. Expo가 패치를 낼 때마다 "버전이 뒤졌다"로
# 실패해서, 우리 코드가 멀쩡한데도 CI가 빨개진다. 의존성 점검은 사람이 주기적으로
# `pnpm dlx expo-doctor`를 돌리는 편이 낫다.
